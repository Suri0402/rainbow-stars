<!doctype html>
<html lang="de">
<head>
<title>Rainbow Stars</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe8f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rainbow Stars">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Patrick+Hand&display=swap">
<style>
/* Layout: Vollbild-Papierwelt; Titel + Sprechblase oben links, Bedienung unten. Feste Bleistift-auf-Papier-Optik. */
:root{
  --ink:#342c3a; --muted:#7d6f80; --paper:#fbf7ee; --pink:#ffb3cf; --mint:#c4f0dc; --sun:#ffe9a3;
  --f-display:"Fredoka",system-ui,sans-serif; --f-hand:"Patrick Hand","Comic Sans MS",cursive;
  color-scheme:light;
}
html,body{height:100%}
body{background:linear-gradient(180deg,#d6e9ff 0%,#efe4ff 38%,#ffe8f1 62%,#fff4e6 100%);color:var(--ink);font-family:var(--f-hand);overflow:hidden;touch-action:none}
#stage{position:fixed;inset:0;cursor:grab}
#stage:active{cursor:grabbing}
canvas{display:block}
#paper{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.12;background-size:256px 256px}
.hud{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));pointer-events:none;display:flex;justify-content:space-between;gap:12px}
.top{top:calc(14px + env(safe-area-inset-top,0px));flex-direction:column;align-items:flex-start}
.bottom{bottom:calc(16px + env(safe-area-inset-bottom,0px));align-items:flex-end;flex-wrap:wrap}
h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(28px,4.4vw,46px);line-height:1;letter-spacing:.01em;
  background:linear-gradient(90deg,#ff7aa8,#ffb35c,#f5d33d,#5fd39a,#5fb4ff,#a98bff);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;filter:drop-shadow(2px 2px 0 rgba(52,44,58,.25))}
.bubble{background:var(--paper);border:2px solid var(--ink);border-radius:20px 20px 20px 5px;padding:6px 14px 8px;font-size:19px;line-height:1.15;max-width:min(400px,100%);box-shadow:3px 3px 0 var(--ink)}
.bubble small{display:block;font-size:13px;color:var(--muted);letter-spacing:.06em}
.controls{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:18px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 16px 6px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
button:hover{background:var(--sun)}
button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:3px solid #ff7aa8;outline-offset:2px}
.swatches{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:4px 10px;box-shadow:2px 2px 0 var(--ink)}
.swatches span{font-size:17px;margin-right:2px}
.sw{width:24px;height:24px;padding:0;border-radius:50%;background:var(--c);border:2px solid var(--ink);box-shadow:none}
.sw:hover{background:var(--c);transform:scale(1.12)}
.sw[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.hint{font-size:16px;background:rgba(251,247,238,.85);border-radius:10px;padding:4px 10px}
@media (max-width:560px){.hint{display:none}}
/* Scan-Dialog: Papierblatt über der Welt */
button.main{background:var(--pink)}
button:disabled{opacity:.5;cursor:default}
.scan{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(52,44,58,.35);user-select:text;-webkit-user-select:text}
.sheet{position:relative;width:min(520px,100%);max-height:100%;overflow:auto;touch-action:pan-y;background:var(--paper);border:2px solid var(--ink);border-radius:22px;box-shadow:4px 4px 0 var(--ink);padding:14px 16px 16px}
.sheet h2{margin:0 44px 8px 0;font-family:var(--f-display);font-weight:600;font-size:24px;line-height:1.1}
.close{position:absolute;top:10px;right:12px;width:36px;height:36px;padding:0;font-size:24px;line-height:1}
.tip,.note{margin:0 0 10px;font-size:17px;line-height:1.25;color:var(--muted)}
.note{margin:10px 0 0}
.view{display:flex;justify-content:center;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:#e9e4da}
.view canvas{max-width:100%;max-height:50vh;touch-action:none}
#cropC{cursor:crosshair}
.paperbg{background:repeating-conic-gradient(#efe8dc 0 25%,#fbf7ee 0 50%) 0 0/20px 20px}
.field{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:18px}
.field input[type=text]{flex:1;min-width:0;font:inherit;font-size:18px;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px 10px}
.field input[type=range]{flex:1;min-width:0;accent-color:#ff7aa8}
.kinds{flex-wrap:wrap}
.kinds label{display:flex;align-items:center;gap:4px}
.kinds input{accent-color:#ff7aa8;width:18px;height:18px}
.row{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
</style>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="stage"></div>
<div id="paper"></div>
<div class="hud top">
  <h1>Rainbow Stars</h1>
  <div class="bubble" aria-live="polite"><small>gerade</small><span id="status">schaut sich um …</span></div>
</div>
<div class="hud bottom">
  <div class="controls">
    <div class="swatches" id="swatches" role="group" aria-label="Haarfarbe"><span>Haare</span></div>
    <button id="next" type="button">Nächstes Abenteuer</button>
    <button id="pause" type="button">Pause</button>
    <button id="scanBtn" type="button" class="main">✎ Figur scannen</button>
  </div>
  <div class="hint">Tippe auf eine Blume, einen Baum oder ein Tier · Ziehen dreht die Kamera · Zeichne eine Figur und scanne sie ein</div>
</div>
<input id="scanFile" type="file" accept="image/*" hidden>
<div id="scan" class="scan" hidden role="dialog" aria-modal="true" aria-labelledby="scanTitle">
  <div class="sheet">
    <h2 id="scanTitle">Neue Figur</h2>
    <button type="button" class="close" id="scanClose" aria-label="Schließen">×</button>
    <div class="step" data-step="crop">
      <p class="tip">Zieh mit dem Finger einen Rahmen um deine Figur. Am besten klappt es mit hellem Licht und einem dunklen Umriss.</p>
      <div class="view"><canvas id="cropC"></canvas></div>
      <div class="row"><button type="button" id="scanRetake">Anderes Foto</button><button type="button" id="scanCropOk" class="main">Weiter</button></div>
    </div>
    <div class="step" data-step="edit" hidden>
      <div class="view paperbg"><canvas id="cutC"></canvas></div>
      <label class="field">Papier entfernen <input id="scanSens" type="range" min="12" max="90" value="38"></label>
      <label class="field">Name <input id="scanName" type="text" maxlength="24" placeholder="z. B. Sternchen" autocomplete="off" enterkeyhint="done"></label>
      <div class="field kinds" role="radiogroup" aria-label="Bewegung"><span>Bewegt sich</span>
        <label><input type="radio" name="scanKind" value="bunny" checked> hüpfend</label>
        <label><input type="radio" name="scanKind" value="bear"> watschelnd</label>
      </div>
      <p class="note" id="scanNote"></p>
      <div class="row"><button type="button" id="scanBack">Zurück</button><button type="button" id="scanGo" class="main">In die Welt schicken ✦</button></div>
    </div>
  </div>
</div>

      st.state = 'idle'; st.timer = .9 + Math.random()*1.3; st.spin = 0; setStatus('schaut sich um …');
    }
  }
  // Blinzeln
  blinkT -= dt;
  if (blinkT <= 0 && blinkP < 0) blinkP = 0;
  if (blinkP >= 0){ blinkP += dt; const e = blinkP < .05 ? 'half' : blinkP < .11 ? 'closed' : blinkP < .16 ? 'half' : null;
    if (e && eye === 'open') eye = e; if (!e){ blinkP = -1; blinkT = 1.8 + Math.random()*3.2; } }
  faceSt.eye = eye; faceSt.mouth = mouth; faceSt.blush = lerp(faceSt.blush, blush, 1 - Math.pow(.02, dt));
  drawFaceOverlay();

  // Bewegung für Nachschwingen (die Zeichnung bleibt seitenrichtig; Richtung zeigt sich durch Neigung)
  const mv = new V3().subVectors(st.pos, prevPos); prevPos.copy(st.pos);
  vScr = lerp(vScr, mv.dot(camRight())/dt, 1 - Math.pow(.002, dt));
  st.faceS = lerp(st.faceS, st.face, 1 - Math.pow(.002, dt));
  const sx = st.spin ? Math.cos(st.spin) : 1;
  flip.scale.x = Math.abs(sx) < .05 ? .05*Math.sign(sx || 1) : sx;
  st.turn = lerp(st.turn, st.face*.2*walk, 1 - Math.pow(.02, dt));

  // Pose anwenden
  girl.position.copy(st.pos);
  const sm = 1 - Math.pow(.0006, dt), smA = 1 - Math.pow(.003, dt);
  hop.position.y = jump;
  hop.scale.y = lerp(hop.scale.y, sqY, 1 - Math.pow(1e-6, dt)); hop.scale.x = 1 + (1 - hop.scale.y)*.85;
  vy = (hop.position.y - prevHopY)/dt; prevHopY = hop.position.y;
  const air = hop.position.y > .03;
  if (lastAir && !air){ SP.ahoge.v -= 3.5; SP.skirtX.v += 1.2; SP.earL.v += 2; SP.earR.v -= 2; }
  lastAir = air;
  const dir = st.faceS;
  J.hips.rotation.z = lerp(J.hips.rotation.z, hipSway, sm);
  J.torso.rotation.z = lerp(J.torso.rotation.z, -lean*dir + .035*s*walk, sm);
  J.torso.scale.y = 1 + breathe;
  J.head.rotation.z = stepS(SP.head, headRot, dt);
  J.head.position.y = BASE.head.y + headBob;
  ['L','R'].forEach((k, i) => {
    const lg = J['leg'+k], bt = J['boot'+k], v = LEGV[k];
    lg.rotation.z = lerp(lg.rotation.z, legRot[i], sm);
    lg.scale.y = lerp(lg.scale.y, 1 - .3*legLift[i], sm);
    const th = lg.rotation.z, vx = v[0], vy2 = v[1]*lg.scale.y;
    bt.position.set(BASE['leg'+k].x + vx*Math.cos(th) - vy2*Math.sin(th), BASE['leg'+k].y + vx*Math.sin(th) + vy2*Math.cos(th) + legLift[i]*.025, 0);
    bt.rotation.z = th*.5;
  });
  J.armL.rotation.z = lerp(J.armL.rotation.z, armL, smA);
  J.armR.rotation.z = lerp(J.armR.rotation.z, armR, smA);
  const avL = (J.armL.rotation.z - prevArmL)/dt, avR = (J.armR.rotation.z - prevArmR)/dt;
  prevArmL = J.armL.rotation.z; prevArmR = J.armR.rotation.z;
  J.handL.rotation.z = stepS(SP.handL, clamp(-avL*.08, -.5, .5), dt);
  J.handR.rotation.z = stepS(SP.handR, clamp(-avR*.08, -.5, .5), dt);
  // Herz, Ohren und Rock schwingen nach
  const tilt = J.head.rotation.z + J.torso.rotation.z + J.hips.rotation.z;
  J.ahoge.rotation.z = stepS(SP.ahoge, clamp(-vScr*.3 - tilt*1.5, -.6, .6), dt);
  twitchT -= dt;
  if (twitchT <= 0){ twitchT = 2 + Math.random()*4; (Math.random() < .5 ? SP.earL : SP.earR).v += (Math.random() < .5 ? -1 : 1)*5; }
  J.earL.rotation.z = stepS(SP.earL, -tilt*.4, dt);
  J.earR.rotation.z = stepS(SP.earR, -tilt*.4, dt);
  J.skirt.rotation.z = stepS(SP.skirt, clamp(-vScr*.1 - J.hips.rotation.z*1.4, -.22, .22), dt);
  J.skirt.scale.x = 1 + stepS(SP.skirtX, clamp(-vy*.05, -.04, .12) + (st.spin ? .08 : 0), dt);
  gShadow.scale.setScalar(1 - jump*.6);
}

function updateAnimal(a, dt, t){
  a.timer -= dt; let moving = false, dir = null;
  if (a.state === 'idle'){ if (a.timer <= 0){ a.state = 'wander'; const ang = Math.random()*6.28, r = 2 + Math.random()*11; a.target.set(Math.cos(ang)*r, 0, Math.sin(ang)*r); } }
  else if (a.state === 'wander'){
    const d = new V3().subVectors(a.target, a.pos); d.y = 0;
    if (d.length() < .1){ a.state = 'idle'; a.timer = 1 + Math.random()*3; }
    else { dir = d.normalize(); a.pos.addScaledVector(dir, a.speed*dt); moving = true; }
  } else if (a.state === 'wait'){
    a.face = new V3().subVectors(st.pos, a.pos).dot(camRight()) > 0 ? 1 : -1;
  } else if (a.state === 'play'){
    a.playA += dt*2.3;
    const want = new V3(st.pos.x + Math.sin(a.playA)*.9, 0, st.pos.z + Math.cos(a.playA)*.55);
    dir = new V3().subVectors(want, a.pos); a.pos.lerp(want, 1 - Math.pow(.02, dt)); moving = true;
  }
  if (dir){ const s = dir.dot(camRight()); if (Math.abs(s) > .05) a.face = s > 0 ? 1 : -1; }
  a.ph += dt*a.hopF*(moving ? 1 : .15);
  a.g.position.copy(a.pos);
  a.body.position.y = moving ? Math.abs(Math.sin(a.ph))*a.hopH : 0;
  if (a.state === 'play' && a.kind === 'bear') a.body.position.y = Math.abs(Math.sin(t*4.5))*.22;
  a.fl.scale.x = lerp(a.fl.scale.x, a.face, 1 - Math.pow(.001, dt));
  a.body.scale.y = a.kind === 'bunny' ? 1 + (moving ? Math.cos(a.ph*2)*.07 : Math.sin(t*3+a.ph)*.015) : 1;
  a.body.rotation.z = a.kind === 'bear' && moving ? Math.sin(a.ph)*.1 : 0;
  if (a.appear !== undefined && a.appear < 1){   // Ankunft: aus dem Nichts wachsen, federn, dabei kurz wackeln
    const u = a.appear = Math.min(1, a.appear + dt/1.6);
    a.g.scale.setScalar(Math.max(.001, 1 - Math.cos(u*Math.PI*2.5)*Math.exp(-5*u)*(1-u)));
    a.body.rotation.z += Math.sin(u*26)*.22*(1-u);
  }
}

const SUPA = {url:'', key:''};
const SHARE = !!(SUPA.url && SUPA.key), MAX_SHARED = 30, BUCKET = 'creatures';
// neue "publishable keys" (sb_…) nur als apikey senden, ältere anon-Schlüssel (JWT) zusätzlich als Bearer
const supaH = (extra={}) => ({apikey:SUPA.key, ...(SUPA.key.startsWith('sb_') ? {} : {Authorization:'Bearer '+SUPA.key}), ...extra});

// lokale Ablage (IndexedDB): eigene Figuren und die zuletzt geladenen geteilten Figuren, damit sie auch offline da sind
const idb = (() => {
  let p; const open = () => p || (p = new Promise((ok, bad) => { const r = indexedDB.open('rainbow-stars', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('creatures', {keyPath:'id'}); r.onsuccess = () => ok(r.result); r.onerror = () => bad(r.error); }));
  const run = (mode, fn) => open().then(db => new Promise((ok, bad) => { const tx = db.transaction('creatures', mode), r = fn(tx.objectStore('creatures'));
    tx.oncomplete = () => ok(r && r.result); tx.onerror = () => bad(tx.error); }));
  return {all: () => run('readonly', s => s.getAll()).catch(() => []), put: v => run('readwrite', s => s.put(v)).catch(() => {}), del: id => run('readwrite', s => s.delete(id)).catch(() => {})};
})();

async function showCreature(rec, {near=false, arrive=false}={}){
  if (world.has(rec.id)) return; world.set(rec.id, null);
  let c; try { c = await blobCanvas(rec.blob); } catch(e){ world.delete(rec.id); return; }
  if (!world.has(rec.id)) return;   // in der Zwischenzeit entfernt
  const w = Math.min(1.3, .8*c.width/c.height), ang = Math.random()*Math.PI*2;
  const pos = near ? st.pos.clone().addScaledVector(camRight(), (Math.random() < .5 ? -1 : 1)*1.9).add(new V3(Math.sin(az)*.6, 0, Math.cos(az)*.6))
                   : new V3(Math.cos(ang), 0, Math.sin(ang)).multiplyScalar(3 + Math.random()*8);
  const a = addCreature({name:rec.name, c, w, kind:rec.kind, pos, rnd:Math.random, appear: arrive ? 0 : undefined});
  world.set(rec.id, a);
  if (arrive){ arrivalFx(a); setStatus(rec.name + ' ist angekommen! ✦'); setTimeout(() => { if (animals.includes(a)) startActivity(a.act); }, 2400); }
}
function removeCreature(id){
  const a = world.get(id); world.delete(id); if (!a) return;
  if (st.act && st.act.ref === a){ st.act = null; st.state = 'idle'; st.timer = .6; }
  if (st.last && st.last.ref === a) st.last = null;
  scene.remove(a.g);
  [[animals,a],[activities,a.act],[pickables,a.mesh],[bills,a.bb],[fadeables,a.mesh]].forEach(([arr,v]) => { const i = arr.indexOf(v); if (i >= 0) arr.splice(i,1); });
  const img = a.mesh.material.map.image, tx = texCache.get(img); if (tx){ tx.dispose(); texCache.delete(img); }
}

// --- Teilen über Supabase (REST, ohne Zusatzbibliothek) ---
async function uploadCreature(rec){
  if (!SHARE || rec.uploaded || !navigator.onLine) return false;
  const path = rec.id + '.png';
  const up = await fetch(`${SUPA.url}/storage/v1/object/${BUCKET}/${path}`, {method:'POST', headers:supaH({'Content-Type':'image/png'}), body:rec.blob});
  if (!up.ok && !/duplicate|exists/i.test(await up.text())) throw new Error('Bild-Upload: ' + up.status);
  const ins = await fetch(`${SUPA.url}/rest/v1/creatures`, {method:'POST', headers:supaH({'Content-Type':'application/json', Prefer:'return=minimal'}),
    body:JSON.stringify({id:rec.id, name:rec.name, kind:rec.kind, image_path:path})});
  if (!ins.ok && ins.status !== 409) throw new Error('Eintrag: ' + ins.status);
  rec.uploaded = true; await idb.put(rec); return true;
}
function shareCreature(rec){
  if (!SHARE) return;
  uploadCreature(rec).then(done => { if (done) setTimeout(() => setStatus(rec.name + ' wartet jetzt auf die Freigabe für alle ✉'), 9000); })
    .catch(e => { console.warn('Teilen fehlgeschlagen, neuer Versuch später', e); });
}
let syncing = false;
async function syncShared(first){
  if (!SHARE || !navigator.onLine || syncing) return; syncing = true;
  try {
    const res = await fetch(`${SUPA.url}/rest/v1/creatures?select=id,name,kind,image_path,created_at&approved=eq.true&order=created_at.desc&limit=${MAX_SHARED}`, {headers:supaH(), cache:'no-store'});
    if (!res.ok) throw new Error('Liste: ' + res.status);
    const rows = await res.json(), ids = new Set(rows.map(r => r.id)), local = await idb.all();
    // fremde Figuren, die nicht mehr freigegeben (oder zu alt) sind, verschwinden wieder
    for (const r of local) if (!r.mine && !ids.has(r.id)){ removeCreature(r.id); idb.del(r.id); }
    const known = new Set(local.map(r => r.id));
    for (const row of rows.reverse()){
      if (known.has(row.id)) continue;
      const img = await fetch(`${SUPA.url}/storage/v1/object/public/${BUCKET}/${encodeURIComponent(row.image_path)}`); if (!img.ok) continue;
      const rec = {id:row.id, name:String(row.name || 'Freund').slice(0,24), kind:row.kind === 'bear' ? 'bear' : 'bunny', blob:await img.blob(), mine:false, created:Date.parse(row.created_at) || Date.now()};
      await idb.put(rec); showCreature(rec, {arrive:!first});
    }
  } catch(e){ console.warn('Geteilte Figuren konnten nicht geladen werden', e); }
  syncing = false;
}
function retryUploads(){ idb.all().then(recs => recs.filter(r => r.mine && !r.uploaded).forEach(r => uploadCreature(r).catch(() => {}))); }
idb.all().then(recs => { recs.sort((a,b) => a.created - b.created).forEach(r => showCreature(r)); retryUploads(); syncShared(true); });
addEventListener('online', () => { retryUploads(); syncShared(false); });
setInterval(() => { if (document.visibilityState === 'visible') syncShared(false); }, 90000);

function photoCanvas(file){ return new Promise((ok, bad) => { const u = URL.createObjectURL(file), im = new Image();

  for (let y=0;y<H;y++) for (let x=0;x<W;x++){ const i = y*W+x; if (!m[i]) continue; o[i] = 1; if (x>0) o[i-1] = 1; if (x<W-1) o[i+1] = 1; if (y>0) o[i-W] = 1; if (y<H-1) o[i+W] = 1; }
  return o; }
// Schneidet die Zeichnung vom Papier aus. th: wie stark sich ein Strich vom Papier abheben muss (größer = mehr wird entfernt).
function cutout(src, r, th){
  const k = Math.min(1, 720/Math.max(r.w, r.h)), W = Math.max(8, Math.round(r.w*k)), H = Math.max(8, Math.round(r.h*k)), N = W*H;
  const [, wx] = cnv(W, H); wx.drawImage(src, r.x, r.y, r.w, r.h, 0, 0, W, H);
  const d = wx.getImageData(0, 0, W, H).data;
  // 1) Papierfarbe je Kachel (hellste 10 %), damit Schatten und Licht-Verläufe im Foto nicht stören
  const CS = 24, GX = Math.ceil(W/CS), GY = Math.ceil(H/CS), cells = GX*GY, bg = new Float32Array(cells*3), ok = new Uint8Array(cells);
  for (let gy=0; gy<GY; gy++) for (let gx=0; gx<GX; gx++){
    const h = [new Uint32Array(256), new Uint32Array(256), new Uint32Array(256)]; let n = 0;
    for (let y=gy*CS; y<Math.min(H,(gy+1)*CS); y++) for (let x=gx*CS; x<Math.min(W,(gx+1)*CS); x++){ const i = (y*W+x)*4; h[0][d[i]]++; h[1][d[i+1]]++; h[2][d[i+2]]++; n++; }
    for (let ch=0; ch<3; ch++){ let acc = 0, v = 255; for (; v>0; v--){ acc += h[ch][v]; if (acc >= n*.1) break; } bg[(gy*GX+gx)*3+ch] = v; }
  }

  const refL = Array.from({length:cells}, (_,i) => lum(i)).sort((a,b) => a-b)[Math.floor(cells*.7)];
  const refC = Array.from({length:cells}, (_,i) => chroma(i)).sort((a,b) => a-b)[Math.floor(cells*.5)];
  for (let i=0;i<cells;i++) ok[i] = lum(i) >= refL*.62 && chroma(i) < refC + 22 ? 1 : 0;
  if (!ok.includes(1)) for (let i=0;i<cells;i++){ bg[i*3] = bg[i*3+1] = bg[i*3+2] = refL; ok[i] = 1; }
  // Kacheln, die ganz von der Figur bedeckt sind, bekommen die Papierfarbe ihrer Nachbarn
  for (let pass=0; pass<GX+GY && ok.includes(0); pass++){ const nk = ok.slice();
    for (let gy=0; gy<GY; gy++) for (let gx=0; gx<GX; gx++){ const i = gy*GX+gx; if (ok[i]) continue; const s = [0,0,0]; let m = 0;
      for (let dy=-1; dy<=1; dy++) for (let dx=-1; dx<=1; dx++){ const X = gx+dx, Y = gy+dy; if (X<0||Y<0||X>=GX||Y>=GY || !ok[Y*GX+X]) continue; const j = Y*GX+X; s[0] += bg[j*3]; s[1] += bg[j*3+1]; s[2] += bg[j*3+2]; m++; }
      if (m){ bg[i*3] = s[0]/m; bg[i*3+1] = s[1]/m; bg[i*3+2] = s[2]/m; nk[i] = 1; } }
    ok.set(nk); }

  const ink = new Uint8Array(N), col = new Uint8ClampedArray(N*4);
  for (let y=0;y<H;y++){ const fy = clamp(y/CS-.5, 0, GY-1), y0 = Math.floor(fy), y1 = Math.min(GY-1, y0+1), ty = fy-y0;
    for (let x=0;x<W;x++){ const fx = clamp(x/CS-.5, 0, GX-1), x0 = Math.floor(fx), x1 = Math.min(GX-1, x0+1), tx = fx-x0, p = (y*W+x)*4; let mn = 255;
      for (let ch=0; ch<3; ch++){ const b = (bg[(y0*GX+x0)*3+ch]*(1-tx) + bg[(y0*GX+x1)*3+ch]*tx)*(1-ty) + (bg[(y1*GX+x0)*3+ch]*(1-tx) + bg[(y1*GX+x1)*3+ch]*tx)*ty;
        const v = 255 - (255 - Math.min(255, d[p+ch]/Math.max(40,b)*255))*1.12; col[p+ch] = v; if (v < mn) mn = v; }
      ink[y*W+x] = 255 - mn > th ? 1 : 0; } }
  // 3) Lücken im Umriss schließen, Papier von außen her fluten: alles, was nicht erreicht wird, gehört zur Figur (auch weiße Innenflächen)
  const wall = dilate(dilate(ink, W, H), W, H), outside = new Uint8Array(N), q = new Int32Array(N); let qh = 0, qt = 0;
  const border = []; for (let x=0;x<W;x++) border.push(x, (H-1)*W+x); for (let y=0;y<H;y++) border.push(y*W, y*W+W-1);
  // dunkle Flächen, die mehrere Bildränder berühren (Tisch, Papierkante), gehören zum Hintergrund
  const seen = new Uint8Array(N);
  for (const s of border){ if (!wall[s] || seen[s]) continue; let sides = 0; qh = qt = 0; seen[s] = 1; q[qt++] = s;
    while (qh < qt){ const i = q[qh++], x = i%W, y = (i/W)|0; if (x===0) sides |= 1; if (x===W-1) sides |= 2; if (y===0) sides |= 4; if (y===H-1) sides |= 8;
      [x>0 && i-1, x<W-1 && i+1, y>0 && i-W, y<H-1 && i+W].forEach(j => { if (j !== false && wall[j] && !seen[j]){ seen[j] = 1; q[qt++] = j; } }); }
    if ((sides&1) + (sides>>1&1) + (sides>>2&1) + (sides>>3&1) >= 2) for (let k=0;k<qt;k++) wall[q[k]] = 0; }
  qh = qt = 0;
  const push = i => { if (!outside[i] && !wall[i]){ outside[i] = 1; q[qt++] = i; } };
  border.forEach(push);
  while (qh < qt){ const i = q[qh++], x = i%W; if (x>0) push(i-1); if (x<W-1) push(i+1); if (i>=W) push(i-W); if (i<N-W) push(i+W); }
  // 4) zusammenhängende Teile; kleine Krümel weg, Tisch-/Papierkanten am Bildrand ignorieren
  const lab = new Int32Array(N), comps = []; qh = qt = 0;
  for (let s=0; s<N; s++){ if (outside[s] || lab[s]) continue; const id = comps.length+1, cp = {id, n:0, sides:0}; let L=1, Rr=1, T=1, B=1;
    lab[s] = id; q[qt++] = s;
    while (qh < qt){ const i = q[qh++], x = i%W, y = (i/W)|0; cp.n++; if (x===0) L=2; if (x===W-1) Rr=2; if (y===0) T=2; if (y===H-1) B=2;
      [x>0 && i-1, x<W-1 && i+1, y>0 && i-W, y<H-1 && i+W].forEach(j => { if (j !== false && !outside[j] && !lab[j]){ lab[j] = id; q[qt++] = j; } }); }
    cp.sides = (L-1)+(Rr-1)+(T-1)+(B-1); comps.push(cp); }
  if (!comps.length) return null;
  const inner = comps.filter(c => c.sides < 2), pool = inner.length ? inner : comps, big = Math.max(...pool.map(c => c.n));
  const keep = new Set(pool.filter(c => c.n >= Math.max(60, big*.06)).map(c => c.id));
  const fig = new Uint8Array(N); for (let i=0;i<N;i++) fig[i] = keep.has(lab[i]) ? 1 : 0;
  // 5) weißer Ausschneide-Rand wie bei einem Sticker, dann auf den Inhalt zuschneiden
  const rim = dilate(dilate(fig, W, H), W, H); let a0=W, b0=H, a1=-1, b1=-1;
  for (let i=0;i<N;i++){ const p = i*4;
    if (fig[i]){ col[p+3] = 255; } else if (rim[i]){ col[p] = 251; col[p+1] = 247; col[p+2] = 238; col[p+3] = 255; } else col[p+3] = 0;
    if (rim[i]){ const x = i%W, y = (i/W)|0; if (x<a0) a0=x; if (x>a1) a1=x; if (y<b0) b0=y; if (y>b1) b1=y; } }
  if (a1 < 0 || (a1-a0) < 12 || (b1-b0) < 12) return null;
  const [fc, fx] = cnv(W, H); fx.putImageData(new ImageData(col, W, H), 0, 0);
  const s = Math.min(1, 512/Math.max(a1-a0+1, b1-b0+1)), [oc, ox] = cnv(Math.round((a1-a0+5)*s), Math.round((b1-b0+5)*s));
  ox.imageSmoothingQuality = 'high'; ox.drawImage(fc, a0-2, b0-2, a1-a0+5, b1-b0+5, 0, 0, oc.width, oc.height);
  return oc;
}

// --- Scan-Dialog ---
const scanEl = $('scan'), cropC = $('cropC'), cutC = $('cutC'), scanS = {photo:null, crop:null, cut:null};
const scanStep = s => { scanEl.querySelectorAll('.step').forEach(e => e.hidden = e.dataset.step !== s); scanEl.hidden = false; };
const closeScan = () => { scanEl.hidden = true; scanS.photo = scanS.cut = null; };
function drawCrop(){ const x = cropC.getContext('2d'), r = scanS.crop; x.drawImage(scanS.photo, 0, 0);
  x.fillStyle = 'rgba(52,44,58,.5)'; x.beginPath(); x.rect(0, 0, cropC.width, cropC.height); x.rect(r.x, r.y, r.w, r.h); x.fill('evenodd');
  const lw = Math.max(3, cropC.width/200); x.lineWidth = lw; x.strokeStyle = '#ff7aa8'; x.setLineDash([lw*4, lw*2.5]); x.strokeRect(r.x, r.y, r.w, r.h); x.setLineDash([]); }
function renderCut(){
  scanS.cut = cutout(scanS.photo, scanS.crop, +$('scanSens').value);
  const c = scanS.cut, x = cutC.getContext('2d');
  cutC.width = c ? c.width : 320; cutC.height = c ? c.height : 200; if (c) x.drawImage(c, 0, 0);
  $('scanGo').disabled = !c;
  $('scanNote').textContent = !c ? 'Keine Figur gefunden. Zieh den Rahmen enger oder schieb den Regler nach links.'
    : SHARE ? 'Deine Figur erscheint sofort bei dir. Für alle anderen erscheint sie, sobald sie freigegeben ist.'
    : 'Teilen ist noch nicht eingerichtet. Die Figur bleibt auf diesem Gerät.';
}
$('scanBtn').onclick = () => $('scanFile').click();
$('scanFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { scanS.photo = await photoCanvas(f); } catch(err){ setStatus('Das Foto konnte nicht geöffnet werden.'); return; }
  const p = scanS.photo; cropC.width = p.width; cropC.height = p.height;
  scanS.crop = {x:p.width*.03, y:p.height*.03, w:p.width*.94, h:p.height*.94}; drawCrop(); scanStep('crop');
};
let cropDown = null;
const cropPt = e => { const b = cropC.getBoundingClientRect(); return [clamp((e.clientX-b.left)/b.width*cropC.width, 0, cropC.width), clamp((e.clientY-b.top)/b.height*cropC.height, 0, cropC.height)]; };
cropC.addEventListener('pointerdown', e => { cropC.setPointerCapture(e.pointerId); cropDown = cropPt(e); });
cropC.addEventListener('pointermove', e => { if (!cropDown) return; const [x,y] = cropPt(e), [x0,y0] = cropDown;
  if (Math.abs(x-x0) > 12 && Math.abs(y-y0) > 12){ scanS.crop = {x:Math.min(x,x0), y:Math.min(y,y0), w:Math.abs(x-x0), h:Math.abs(y-y0)}; drawCrop(); } });
['pointerup','pointercancel'].forEach(ev => cropC.addEventListener(ev, () => cropDown = null));
$('scanRetake').onclick = () => $('scanFile').click();
$('scanCropOk').onclick = () => { scanStep('edit'); renderCut(); };
$('scanBack').onclick = () => scanStep('crop');
let sensT = 0; $('scanSens').oninput = () => { clearTimeout(sensT); sensT = setTimeout(renderCut, 120); };
$('scanClose').onclick = closeScan;
addEventListener('keydown', e => { if (e.key === 'Escape' && !scanEl.hidden) closeScan(); });
$('scanGo').onclick = () => {
  const c = scanS.cut; if (!c) return;
  const name = $('scanName').value.trim().slice(0,24) || 'Sternchen', kind = scanEl.querySelector('input[name="scanKind"]:checked').value;
  $('scanGo').disabled = true;
  c.toBlob(async blob => {
    const rec = {id:uuid(), name, kind, blob, mine:true, uploaded:false, created:Date.now()};
    await idb.put(rec); closeScan(); $('scanName').value = '';
    showCreature(rec, {near:true, arrive:true}); shareCreature(rec);
  }, 'image/png');
};

// ---------- Loop ----------
const clock = new THREE.Clock(); let t = 0; const tmpW = new V3();
function tick(){
  const dtR = Math.min(clock.getDelta(), .05), dt = paused ? 0 : dtR*(reduce ? .6 : 1);
  t += dt;
  updateGirl(dt, t);
  animals.forEach(a => updateAnimal(a, dt, t));
  butterflies.forEach(b => { const u = b.userData; u.ph += dt*u.s; b.position.set(u.c.x + Math.cos(u.ph)*u.r, u.c.y + Math.sin(u.ph*2.3)*.35, u.c.z + Math.sin(u.ph*1.4)*u.r);
    b.scale.x = .32*(.25 + .75*Math.abs(Math.sin(t*14 + u.ph*4))); });
  stars.forEach(s => { const u = s.userData; s.position.y = u.y + Math.sin(t*.8+u.ph)*.25; s.material.rotation = Math.sin(t*.6+u.ph)*.5; const k = u.s*(1+Math.sin(t*3+u.ph)*.15); s.scale.set(k,k,1); });
  flowers.forEach(f => { f.mesh.rotation.z = Math.sin(t*1.2 + f.ph)*.03; });
  clouds.forEach(c => { const u = c.userData; u.a += u.s*dt; c.position.x = Math.cos(u.a)*u.d; c.position.z = Math.sin(u.a)*u.d; });
  if (!paused && Math.random() < dt*2.5){ const tr = trees[(Math.random()*trees.length)|0];
    spawn(fxTex.star[(Math.random()*6)|0], tr.pos.clone().add(new V3((Math.random()-.5)*2, 2.6, (Math.random()-.5)*.6)), new V3((Math.random()-.5)*.2, -.3, 0), 7, .09); }
  for (let i=fx.length-1;i>=0;i--){ const p = fx[i]; p.life -= dt; p.sp.position.addScaledVector(p.vel, dt); p.sp.position.x += Math.sin(t*2+p.sway)*dt*.12;
    if (p.sp.position.y < .05) p.vel.set(0,0,0);
    p.sp.material.opacity = Math.min(1, p.life/p.max*2.5); if (p.life <= 0){ scene.remove(p.sp); p.sp.material.dispose(); fx.splice(i,1); } }

  // Kamera folgt sanft, Blick bleibt eher frontal
  if (performance.now() - lastDrag > 6000) tAz = angLerp(tAz, Math.round(tAz/(Math.PI*2))*Math.PI*2 + Math.sin(t*.05)*.25, dtR*.15);
  const k = 1 - Math.pow(.03, dtR);
  az = angLerp(az, tAz, k); el += (tEl-el)*k; dist += (tDist-dist)*k;
  camT.lerp(new V3(st.pos.x, 1.0, st.pos.z), 1 - Math.pow(.06, dtR));
  camera.position.set(camT.x + Math.sin(az)*Math.cos(el)*dist, camT.y + Math.sin(el)*dist, camT.z + Math.cos(az)*Math.cos(el)*dist);
  camera.lookAt(camT);
  bills.forEach(b => b.rotation.y = az);
  gBill.rotation.y = az + st.turn;
  // Dinge direkt vor der Kamera ausblenden, damit sie die Sicht nicht verdecken
  fadeables.forEach(m => { const d = m.getWorldPosition(tmpW).distanceTo(camera.position); m.material.opacity = Math.min(1, Math.max(0, (d - 1.6)/2.2)); m.visible = m.material.opacity > .02; });
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
})();
</script>

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
